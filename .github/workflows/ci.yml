name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  fast_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install docker-compose v1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: Run fast + third-party tests + build check
        run: cd .circleci && ./run-tests.sh "Fast=Fast|ThirdParty=ThirdParty" && ./can-build.sh

  playwright_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install docker-compose v1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: Run playwright tests
        run: cd .circleci && ./run-tests.sh "Playwright=Playwright"
      - name: Collect artifacts
        if: always()
        run: |
          docker run --rm \
            -v btcpayservertests_tests_datadir:/data \
            -v /tmp/Artifacts:/host \
            alpine sh -c "cp -r /data/. /host/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: /tmp/Artifacts

  playwright_2_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install docker-compose v1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: Run playwright-2 tests
        run: cd .circleci && ./run-tests.sh "Playwright=Playwright-2"
      - name: Collect artifacts
        if: always()
        run: |
          docker run --rm \
            -v btcpayservertests_tests_datadir:/data \
            -v /tmp/Artifacts:/host \
            alpine sh -c "cp -r /data/. /host/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-2-artifacts
          path: /tmp/Artifacts

  integration_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install docker-compose v1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      - name: Run integration tests
        run: cd .circleci && ./run-tests.sh "Integration=Integration"
